plugins {
    id 'com.android.application'
}
android {
    namespace 'in.co.one7aistore.zeno'
    compileSdk 34
    defaultConfig {
        applicationId "in.co.one7aistore.zeno"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        debug {
            minifyEnabled false
        }
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.2'
}
